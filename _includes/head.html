{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  /* Restore the saved theme before the first paint; use local time only for the first visit. */
  (function () {
    var theme;
    try { theme = localStorage.getItem('theme'); } catch (_) {}
    if (theme !== 'light' && theme !== 'dark') {
      var hour = new Date().getHours();
      theme = hour >= 6 && hour < 18 ? 'light' : 'dark';
      try { localStorage.setItem('theme', theme); } catch (_) {}
    }
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
  })();
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
